<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Entrar · MailLoop</title>
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/login.js" defer></script>
</head>

<body>
    <main>
        <div class="brand">MailLoop</div>
        <h1>Acesse sua central de envios</h1>
        <p>Entre com sua conta de acesso.</p>
        <form id="login"><label for="username">Usuário</label><input id="username" name="username"
                autocomplete="username" maxlength="100" required autofocus><label for="password">Senha</label><input
                id="password" name="password" type="password" autocomplete="current-password" maxlength="256"
                required><button type="submit">Entrar</button>
            <p id="error" role="alert" aria-live="polite"></p>
        </form>
    </main>
</body>

</html>
